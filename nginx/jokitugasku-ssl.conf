# ==============================================================================
# JokiTugasKu v2 — Nginx Production SSL Virtual Hosts (HTTPS & HTTP Redirect)
# Location on VPS: /etc/nginx/sites-available/jokitugasku.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. PUBLIC WEBSITE: https://jokitugasku.id & https://www.jokitugasku.id
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name jokitugasku.id www.jokitugasku.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jokitugasku.id www.jokitugasku.id;

    ssl_certificate /etc/letsencrypt/live/jokitugasku.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jokitugasku.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/jokitugasku/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Dedicated Secure Backend API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Favicon & robots.txt / sitemap.xml
    location ~* \.(ico|png|jpg|jpeg|svg|webp|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

